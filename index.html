<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fundbureau</title>
    <style>
        @font-face {
            font-family: 'LoosBlack';
            src: url('Loos_Normal_Black.otf') format('opentype');
        }
        body {
            background-color: black;
            color: white;
            font-family: 'LoosBlack', Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #events {
            margin-bottom: 70px;
            padding: 20px;
            z-index: 1;
        }
        .event {
            margin-bottom: 70px;
        }
        h2 {
            font-size: 1.5em;
            line-height: 0em;
        }
        p {
            font-size: 1.5em;
            line-height: 0em;
        }
        ul {
            list-style-type: none;
            font-size: 1em;
            padding: 0;
            line-height: .3em;
        }
        u2 {
            list-style-type: none;
            font-size: 1em;
            padding: 0;
            line-height: .9em;
        }
        .footer {
            width: 100%;
            text-align: center;
            position: fixed;
            bottom: 10px;
            left: 0;
            font-size: 1em;
            z-index: 2;
            mix-blend-mode: difference;
        }
        .footer a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            mix-blend-mode: inherit;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw; /* Adjust size as needed */
            z-index: 1;
            mix-blend-mode: difference;
            animation: moveLogo 30s linear infinite; /* Animation applied */
        }

        /* Keyframes for logo animation */
        @keyframes moveLogo {
            0% {
                top: -500vh; /* Start off-screen above */
            }

            100% {
                top: 500vh; /* End off-screen below */
            }
        }
    </style>
</head>
<body>
    <div id="events">
        <!-- Event content will be dynamically loaded here -->
    </div>
    
    <div class="footer">
        <a href="#">Kontakt</a>
        <a href="archive.html">Archiv</a>
        <a href="#">Impressum</a>
    </div>
    
    <img src="logo.svg" alt="Logo" class="logo">

<script>
    const getDayOfWeek = (dateString) => {
        const daysOfWeek = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
        const [day, month, year] = dateString.split(".");
        const date = new Date(`20${year}-${month}-${day}`);
        return `${daysOfWeek[date.getDay()]}, ${dateString}`;
    };

    const parseDateForSorting = (dateString) => {
        const [day, month, year] = dateString.split(".");
        return new Date(`20${year}-${month}-${day}`);
    };

    fetch('Events.json') // Ensure this path is correct
    .then(response => {
        if (!response.ok) {
            throw new Error('Failed to load Events.json');
        }
        return response.json();
    })
    .then(rawData => {
        const eventsData = rawData.map(entry => ({
            dateForSorting: parseDateForSorting(entry[0].trim()), // Trim date
            dateForDisplay: entry[0].trim(), // Trim date
            name: entry[1].trim(), // Trim name
            group1: entry.slice(2, 5).map(item => item.trim()), // Trim each group1 entry
            group2: entry.slice(5).map(item => item.trim()) // Trim each group2 entry
        }));

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const upcomingEvents = eventsData
            .filter(event => event.dateForSorting >= today)
            .sort((a, b) => a.dateForSorting - b.dateForSorting);

        displayEvents(upcomingEvents.slice(0, 3)); // Show the next 3 events
    })
    .catch(error => {
        console.error('Error loading JSON data:', error);
        document.getElementById('events').innerHTML = 'Failed to load event data.';
    });

    const displayEvents = (events) => {
        const eventsContainer = document.getElementById('events');
        if (events.length === 0) {
            eventsContainer.innerHTML = 'No upcoming events.';
            return;
        }

        events.forEach(event => {
            const eventDiv = document.createElement('div');
            eventDiv.classList.add('event');

            eventDiv.innerHTML = `
                <h2>${getDayOfWeek(event.dateForDisplay)}</h2>
                <p><strong>${event.name}</strong></p>
                <ul><li>${event.group1.join(', ')}</li></ul>
                <u2><li>${event.group2.join(', ')}</li></u2>
                
            `;

            eventsContainer.appendChild(eventDiv);
        });
    };
</script>

</body>
</html>
