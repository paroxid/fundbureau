<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Timetable</title>
    <style>html,body{background:#000;height:100%;margin:0;overflow:hidden}canvas{width:100%;height:100%;display:block}#tune{z-index:2;color:#f4f4f5;background:#000000c7;border:1px solid #ffffff29;width:260px;max-height:calc(100vh - 32px);padding:14px 14px 12px;font-family:Segoe UI,sans-serif;position:fixed;bottom:16px;right:16px;overflow:auto}#tune.is-hidden{display:none}.tune-head{justify-content:space-between;align-items:baseline;margin-bottom:10px;display:flex}.tune-head p,.tune-head span{letter-spacing:.16em;text-transform:uppercase;color:#ffffff73;margin:0;font-size:11px}.tune-events{grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:12px;display:grid}.tune-events button{color:#f4f4f5;font:inherit;cursor:pointer;background:0 0;border:1px solid #ffffff38;padding:6px 0;font-size:12px}.tune-events button:disabled{opacity:.35;cursor:default}#event-date{text-align:center;font-variant-numeric:tabular-nums;color:#ffffffb8;min-width:68px;font-size:12px}#event-date.is-preview{color:#fff}.tune-modes{grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;display:grid}.tune-modes button{color:#f4f4f5;font:inherit;cursor:pointer;background:0 0;border:1px solid #ffffff38;padding:6px 0;font-size:12px}.tune-modes button.is-on{color:#000;background:#fff}#tune label{gap:4px;margin-top:10px;font-size:12px;display:grid}#tune label span{color:#ffffffb8;justify-content:space-between;gap:12px;display:flex}#tune output{color:#fff;font-variant-numeric:tabular-nums}#tune input{accent-color:#fff;width:100%;margin:0}#tune input.is-animated{pointer-events:none}#tune input[type=color]{cursor:pointer;background:0 0;border:0;height:28px;padding:0}</style>
    <script type="module" crossorigin src="/timetable/assets/index-CCCbhaa7.js"></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside id="tune" class="is-hidden">
      <div class="tune-head">
        <p>Tune</p>
        <span>T</span>
      </div>
      <div class="tune-events">
        <button id="event-prev" type="button">Previous</button>
        <output id="event-date"></output>
        <button id="event-next" type="button">Next</button>
      </div>
      <label>
        <span>Dither scale <output id="dither-out"></output></span>
        <input id="dither" type="range" min="0.01" max="0.15" step="0.001" value="0.04" />
      </label>
      <label>
        <span>Row stagger <output id="stagger-out">0.00</output></span>
        <input id="stagger" class="is-animated" type="range" min="0" max="1" step="0.01" value="0" tabindex="-1" />
      </label>
      <label>
        <span>Offset X <output id="offset-x-out">0.0px</output></span>
        <input id="offset-x" class="is-animated" type="range" min="0" max="1" step="0.001" value="0" tabindex="-1" />
      </label>
      <label>
        <span>Line spacing <output id="line-out"></output></span>
        <input id="line" type="range" min="0.1" max="1.2" step="0.01" value="0.23" />
      </label>
      <label>
        <span>Letter spacing <output id="letter-out"></output></span>
        <input id="letter" type="range" min="-0.08" max="0.2" step="0.005" value="-0.055" />
      </label>
      <label>
        <span>Gray <output id="gray-out"></output></span>
        <input id="gray" type="range" min="0" max="255" step="1" value="10" />
      </label>
      <label>
        <span>Blur <output id="blur-out"></output></span>
        <input id="blur" type="range" min="0" max="1.5" step="0.05" value="0.4" />
      </label>
      <label>
        <span>Color <output id="color-out"></output></span>
        <input id="color" type="color" value="#ffffff" />
      </label>
      <div class="tune-modes">
        <button id="shape-rings" class="is-on" type="button">Rings</button>
        <button id="shape-square" type="button">Square</button>
        <button id="shape-hexagon" type="button">Hexagon</button>
        <button id="shape-star4" type="button">4-point star</button>
        <button id="shape-star8" type="button">8-point star</button>
        <button id="shape-arrows" type="button">Arrows</button>
      </div>
    </aside>
  </body>
</html>
